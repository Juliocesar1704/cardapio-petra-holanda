<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;display=swap');
    </style>
  </defs>

  <!-- Coração pequeno e delicado no topo -->
  <path d="
    M 150 32
    C 150 28, 145 24, 141 28
    C 137 24, 132 28, 132 32
    C 132 37, 141 43, 141 45
    C 141 43, 150 37, 150 32 Z"
    fill="#3D4A3F"/>

  <!-- Texto "Petra" -->
  <text x="150" y="90"
    font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif"
    font-size="48"
    font-weight="500"
    fill="#3D4A3F"
    text-anchor="middle"
    letter-spacing="1">Petra</text>

  <!-- Texto "Holanda" -->
  <text x="150" y="132"
    font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif"
    font-size="48"
    font-weight="500"
    fill="#3D4A3F"
    text-anchor="middle"
    letter-spacing="1">Holanda</text>

  <!-- Texto "CONFEITARIA" em caixa alta espaçada -->
  <text x="150" y="158"
    font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif"
    font-size="13"
    font-weight="400"
    fill="#3D4A3F"
    text-anchor="middle"
    letter-spacing="4.5">CONFEITARIA</text>
</svg>
